<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise Installer</title>

<style>
body {
    margin: 0;
    background: #f2f2f7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: #ffffff;
    padding: 40px;
    border-radius: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 420px;
    text-align: center;
}

h1 {
    font-weight: 600;
    font-size: 22px;
    margin-bottom: 30px;
    color: #1c1c1e;
}

.grid {
    display: grid;
    gap: 15px;
}

.install-btn {
    display: block;
    padding: 14px;
    border-radius: 14px;
    background: #007aff;
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    transition: 0.15s ease;
}

.install-btn:active {
    background: #005ecb;
    transform: scale(0.98);
}

.footer {
    margin-top: 25px;
    font-size: 12px;
    color: #8e8e93;
}
</style>
</head>

<body>

<div class="container">
    <h1>App Installation</h1>

    <div class="grid">
        <a class="install-btn" href="itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/8ygh/ipa-files/refs/heads/main/Commission.plist">Install</a>
        <a class="install-btn" href="itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/8ygh/ipa-files/refs/heads/main/Etisalat.plist">Install</a>
        <a class="install-btn" href="itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/8ygh/ipa-files/refs/heads/main/Forevermark.plist">Install</a>
        <a class="install-btn" href="itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/8ygh/ipa-files/refs/heads/main/PowerChina.plist">Install</a>
        <a class="install-btn" href="itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/8ygh/ipa-files/refs/heads/main/Qingdao.plist">Install</a>
        <a class="install-btn" href="itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/8ygh/ipa-files/refs/heads/main/Railway.plist">Install</a>
        <a class="install-btn" href="itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/8ygh/ipa-files/refs/heads/main/Takeoff.plist">Install</a>
        <a class="install-btn" href="itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/8ygh/ipa-files/refs/heads/main/Telecom.plist">Install</a>
        <a class="install-btn" href="itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/8ygh/ipa-files/refs/heads/main/Tianjin.plist">Install</a>
        <a class="install-btn" href="itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/8ygh/ipa-files/refs/heads/main/Wasu.plist">Install</a>
    </div>

    <div class="footer">
        Internal Distribution
    </div>
</div>

</body>
</html>
