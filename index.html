<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Install Version</title>

<style>
:root {
    --primary: #6366f1;
    --accent: #a855f7;
    --bg-dark: #030712;
    --glass: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.1);
    --text-main: #f8fafc;
    --text-dim: #64748b;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

body {
    background-color: var(--bg-dark);
    background-image: 
        radial-gradient(circle at 50% -20%, rgba(99, 102, 241, 0.2), transparent 80%),
        radial-gradient(circle at 0% 100%, rgba(168, 85, 247, 0.1), transparent 50%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: var(--text-main);
}

.card {
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 28px;
    padding: 50px 30px;
    width: 100%;
    max-width: 450px;
    text-align: center;
    box-shadow: 
        0 0 0 1px var(--glass-border),
        0 25px 50px -12px rgba(0, 0, 0, 0.5);
}

h1 {
    font-size: 1.9rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 40px;
    background: linear-gradient(to bottom, #fff, #94a3b8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.button-container {
    display: grid;
    gap: 18px;
}

.select-btn {
    position: relative;
    padding: 20px;
    border-radius: 20px;
    text-decoration: none;
    color: white;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--glass-border);
    font-weight: 600;
    font-size: 1rem;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
}

.select-btn:hover {
    transform: translateY(-4px) scale(1.03);
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-color: transparent;
    box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
}

.select-btn:active {
    transform: scale(0.97);
}
</style>
</head>

<body>

<div class="card">
    <h1>Select Install Version</h1>

    <div class="button-container">
        <a href="https://8ygh.github.io/global/" class="select-btn">Ronix Global (not Vietnam)</a>
        <a href="https://8ygh.github.io/vng/" class="select-btn">Ronix VNG (For Vietnam)</a>
    </div>
</div>

</body>
</html>
