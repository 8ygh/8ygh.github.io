<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Installer</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
    background: linear-gradient(180deg, #f9f9fb 0%, #ececf1 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
}

.container {
    background: white;
    padding: 50px 40px;
    border-radius: 30px;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
    text-align: center;
}

h1 {
    margin-bottom: 35px;
    font-size: 24px;
    font-weight: 600;
    color: #1c1c1e;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.install-btn {
    display: block;
    padding: 16px 0;
    border-radius: 18px;
    background: linear-gradient(135deg, #0a84ff, #0066ff);
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    transition: all 0.15s ease;
    box-shadow: 0 8px 20px rgba(0, 122, 255, 0.25);
}

.install-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(0, 122, 255, 0.35);
}

.install-btn:active {
    transform: scale(0.97);
    box-shadow: 0 6px 14px rgba(0, 122, 255, 0.25);
}

.footer {
    margin-top: 30px;
    font-size: 13px;
    color: #8e8e93;
}

@media (max-width: 500px) {
    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>App Installation</h1>

    <div class="grid">
        <a class="install-btn" href="#">Install</a>
        <a class="install-btn" href="#">Install</a>
        <a class="install-btn" href="#">Install</a>
        <a class="install-btn" href="#">Install</a>
        <a class="install-btn" href="#">Install</a>
        <a class="install-btn" href="#">Install</a>
        <a class="install-btn" href="#">Install</a>
        <a class="install-btn" href="#">Install</a>
        <a class="install-btn" href="#">Install</a>
        <a class="install-btn" href="#">Install</a>
    </div>

    <div class="footer">
        Enterprise Distribution
    </div>
</div>

</body>
</html>
