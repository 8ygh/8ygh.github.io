<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Select Install Version</title>

<style>
:root{
--primary:#6366f1;
--accent:#a855f7;
--bg-dark:#01000d;
--glass:rgba(255,255,255,0.03);
--glass-border:rgba(255,255,255,0.1);
--text-main:#f8fafc;
--text-dim:#64748b;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
background:var(--bg-dark);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:var(--text-main);
overflow-y:auto;
-webkit-overflow-scrolling:touch;
position:relative;
}

/* star canvas */
#bg-canvas{
position:fixed;
inset:0;
z-index:-1;
}

/* card */

.card{
background:var(--glass);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border-radius:28px;
padding:50px 30px;
width:100%;
max-width:450px;
text-align:center;

box-shadow:
0 0 0 1px var(--glass-border),
0 25px 50px -12px rgba(0,0,0,0.6);
}

/* logo */

.logo-container{
position:relative;
display:inline-block;
margin-bottom:20px;
}

.logo-glow{
position:absolute;
inset:-8px;
background:linear-gradient(135deg,var(--primary),var(--accent));
filter:blur(15px);
opacity:.3;
border-radius:35px;
animation:pulse 3s infinite alternate;
}

@keyframes pulse{
from{transform:scale(.9);opacity:.2}
to{transform:scale(1.1);opacity:.45}
}

.logo{
width:90px;
height:90px;
border-radius:26px;
object-fit:cover;
border:1px solid rgba(255,255,255,0.1);
position:relative;
}

/* title */

h1{
font-size:1.9rem;
font-weight:700;
letter-spacing:-0.03em;
margin-bottom:35px;
background:linear-gradient(to bottom,#fff,#94a3b8);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* buttons */

.button-container{
display:grid;
gap:16px;
}

.select-btn{
position:relative;
padding:22px;
border-radius:20px;
text-decoration:none;
color:white;
background:rgba(255,255,255,0.04);
border:1px solid var(--glass-border);
font-weight:600;
font-size:0.95rem;
transition:all .35s cubic-bezier(.34,1.56,.64,1);
overflow:hidden;
}

.select-btn:hover{
transform:translateY(-4px) scale(1.03);
background:linear-gradient(135deg,var(--primary),var(--accent));
border-color:transparent;
box-shadow:0 10px 25px rgba(139,92,246,0.35);
}

.select-btn:active{
transform:scale(.95);
}

.footer{
margin-top:35px;
font-size:10px;
color:var(--text-dim);
letter-spacing:.12em;
text-transform:uppercase;
opacity:.5;
}
</style>
</head>

<body>

<canvas id="bg-canvas"></canvas>

<div class="card">

<h1>Select Install Version</h1>

<div class="button-container">

<a href="https://8ygh.github.io/global/" class="select-btn">
Ronix Global<br>
<small style="opacity:.7;font-weight:500;">For Non-Vietnamese Users</small>
</a>

<a href="https://8ygh.github.io/vng/" class="select-btn">
Ronix VNG<br>
<small style="opacity:.7;font-weight:500;">For Vietnamese Users / Vietnam Only</small>
</a>

</div>

<div class="footer">RONIX INSTALL SELECTOR</div>

</div>

<script>

/* star background */

const canvas=document.getElementById("bg-canvas");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let stars=[];

for(let i=0;i<250;i++){
stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*1.5,
a:Math.random(),
s:Math.random()*0.01+0.002
});
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);

stars.forEach(star=>{
star.a+=star.s;
if(star.a<=0||star.a>=1) star.s*=-1;

ctx.beginPath();
ctx.arc(star.x,star.y,star.r,0,Math.PI*2);
ctx.fillStyle=`hsla(270,80%,80%,${star.a})`;
ctx.fill();
});

requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
