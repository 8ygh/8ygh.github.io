<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>App Installer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
            padding: 40px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 600px;
            margin: auto;
        }

        a.button {
            display: inline-block;
            padding: 15px;
            background: #00aaff;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.2s;
        }

        a.button:hover {
            background: #0088cc;
        }

        .warning {
            margin-bottom: 30px;
            color: #ff5555;
        }
    </style>
</head>
<body>

<h1>App Installation Page</h1>

<p class="warning">
    Only install apps from trusted sources. Make sure you understand what you are installing.
</p>

<div class="container">
    <a class="button" href="itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/8ygh/ipa-files/refs/heads/main/Commission.plist">Install 1</a>
